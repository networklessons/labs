    configuration:
      - name: ios_config.txt
        content: |
          hostname R1
          !
          no ip domain lookup
          !
          interface GigabitEthernet0/1
           ip address 192.168.1.1 255.255.255.0
           vrrp 1 ip 192.168.1.3
           vrrp 1 priority 150
           vrrp 1 authentication md5 key-string mykey
           vrrp 2 ip 192.168.1.4
           no shutdown
          !
          line con 0
           exec-timeout 0 0
           logging synchronous
          !
          end

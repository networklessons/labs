lab:
  title: Performance Monitor ezPM re-capture (lab-490)
  description: 'cisco-performance-monitor (post 57176): R1 IOSv 15.9(3)M9 Gi0/1 192.168.2.1 to S1 192.168.2.200, Gi0/2 192.168.1.254 to H1 192.168.1.1. Manual Performance Monitor policy (shortened flow records) plus ezPM context EZPM on Gi0/2.'
  notes: ''
  version: 0.3.1
nodes:
  - id: n0
    label: R1
    node_definition: iosv
    x: 0
    y: 0
    configuration:
      - name: ios_config.txt
        content: |-
          hostname R1
          !
          ip cef
          !
          flow record type performance-monitor FLOW_RECORD_RTP
           match ipv4 protocol
           match ipv4 source address
           match ipv4 destination address
           match transport source-port
           match transport destination-port
           match transport rtp ssrc
           collect transport rtp jitter mean
           collect counter packets
          !
          flow record type performance-monitor FLOW_RECORD_TCP
           match ipv4 protocol
           match ipv4 source address
           match ipv4 destination address
           match transport source-port
           match transport destination-port
           collect transport round-trip-time
           collect counter packets
          !
          flow exporter NETFLOW_SERVER
           destination 192.168.2.200
           source GigabitEthernet0/1
           transport udp 2055
           template data timeout 60
          !
          flow monitor type performance-monitor FLOW_MONITOR_RTP
           record FLOW_RECORD_RTP
           exporter NETFLOW_SERVER
           cache entries 100
           cache timeout synchronized 10
          !
          flow monitor type performance-monitor FLOW_MONITOR_TCP
           record FLOW_RECORD_TCP
           exporter NETFLOW_SERVER
           cache entries 1000
          !
          performance monitor context EZPM profile application-statistics
           exporter destination 192.168.2.200 source GigabitEthernet0/1
           traffic-monitor application-stats
          !
          class-map match-all TCP
           match access-group name TCP_TRAFFIC
          class-map match-all RTP
           match access-group name UDP_TRAFFIC
          !
          policy-map type performance-monitor PERFORMANCE_MONITOR
           class RTP
            flow monitor FLOW_MONITOR_RTP
           class TCP
            flow monitor FLOW_MONITOR_TCP
          !
          interface GigabitEthernet0/1
           ip address 192.168.2.1 255.255.255.0
           no shutdown
          !
          interface GigabitEthernet0/2
           ip address 192.168.1.254 255.255.255.0
           performance monitor context EZPM
           service-policy type performance-monitor input PERFORMANCE_MONITOR
           service-policy type performance-monitor output PERFORMANCE_MONITOR
           no shutdown
          !
          ip access-list extended TCP_TRAFFIC
           permit tcp any any
          ip access-list extended UDP_TRAFFIC
           permit udp any any
          !
          line con 0
           exec-timeout 0 0
          !
          end
    interfaces:
      - {id: i0, label: Loopback0, type: loopback}
      - {id: i1, label: GigabitEthernet0/0, type: physical, slot: 0}
      - {id: i2, label: GigabitEthernet0/1, type: physical, slot: 1}
      - {id: i3, label: GigabitEthernet0/2, type: physical, slot: 2}
  - id: n1
    label: S1
    node_definition: iosv
    x: 200
    y: 0
    configuration:
      - name: ios_config.txt
        content: |-
          hostname S1
          !
          no ip routing
          !
          interface GigabitEthernet0/1
           ip address 192.168.2.200 255.255.255.0
           no shutdown
          !
          ip default-gateway 192.168.2.1
          !
          line con 0
           exec-timeout 0 0
          !
          end
    interfaces:
      - {id: i0, label: Loopback0, type: loopback}
      - {id: i1, label: GigabitEthernet0/0, type: physical, slot: 0}
      - {id: i2, label: GigabitEthernet0/1, type: physical, slot: 1}
  - id: n2
    label: H1
    node_definition: iosv
    x: -200
    y: 0
    configuration:
      - name: ios_config.txt
        content: |-
          hostname H1
          !
          no ip routing
          !
          no ip cef
          !
          interface GigabitEthernet0/1
           ip address 192.168.1.1 255.255.255.0
           no shutdown
          !
          ip default-gateway 192.168.1.254
          !
          line con 0
           exec-timeout 0 0
          !
          end
    interfaces:
      - {id: i0, label: Loopback0, type: loopback}
      - {id: i1, label: GigabitEthernet0/0, type: physical, slot: 0}
      - {id: i2, label: GigabitEthernet0/1, type: physical, slot: 1}
links:
  - {id: l0, n1: n0, i1: i2, n2: n1, i2: i2, label: R1-GigabitEthernet0/1<->S1-GigabitEthernet0/1}
  - {id: l1, n1: n0, i1: i3, n2: n2, i2: i2, label: R1-GigabitEthernet0/2<->H1-GigabitEthernet0/1}

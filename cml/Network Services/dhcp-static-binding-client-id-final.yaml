nodes:
  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |
          hostname DHCP
          !
          no ip domain lookup
          !
          ip cef
          !
          ip dhcp pool MYPOOL
           network 192.168.1.0 255.255.255.0
          !
          ip dhcp pool R1-STATIC
           host 192.168.1.100 255.255.255.0
           client-identifier 0152.5400.2ee0.f8
          !
          ip dhcp pool PC1-STATIC
           host 192.168.1.110 255.255.255.0
           client-identifier 0152.5400.c58c.16
          !
          ip dhcp pool LINUX-STATIC
           host 192.168.1.120 255.255.255.0
           hardware-address 5254.007c.59d5
          !
          interface GigabitEthernet0/0
           ip address 192.168.1.254 255.255.255.0
           no shutdown
          !
          line con 0
           exec-timeout 0 0
           logging synchronous
          !
          end

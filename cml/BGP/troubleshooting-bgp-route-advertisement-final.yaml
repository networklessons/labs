annotations: []
smart_annotations: []
nodes:
  - configuration:
      - name: ios_config.txt
        content: |-
          hostname R1
          no ip domain-lookup
          interface GigabitEthernet0/0
           ip address 192.168.12.1 255.255.255.0
           no shutdown
          interface Loopback0
           ip address 1.1.1.1 255.255.255.0
          router bgp 1
           redistribute connected
           neighbor 192.168.12.2 remote-as 2
           auto-summary
          line con 0
           exec-timeout 0 0
           logging synchronous
          end
    hide_links: false
    id: n0
    label: R1
    node_definition: iosv
    x: 0
    y: 0
    interfaces:
      - id: i0
        label: Loopback0
        type: loopback
      - id: i1
        label: GigabitEthernet0/0
        type: physical
        slot: 0
  - configuration:
      - name: ios_config.txt
        content: |-
          hostname R2
          no ip domain-lookup
          interface GigabitEthernet0/0
           ip address 192.168.12.2 255.255.255.0
           no shutdown
          router bgp 2
           neighbor 192.168.12.1 remote-as 1
          line con 0
           exec-timeout 0 0
           logging synchronous
          end
    hide_links: false
    id: n1
    label: R2
    node_definition: iosv
    x: 200
    y: 0
    interfaces:
      - id: i0
        label: Loopback0
        type: loopback
      - id: i1
        label: GigabitEthernet0/0
        type: physical
        slot: 0
links:
  - id: l0
    n1: n0
    n2: n1
    i1: i1
    i2: i1
    label: R1-GigabitEthernet0/0<->R2-GigabitEthernet0/0
lab:
  description: 'troubleshooting-bgp-route-advertisement (post 7074) BGP Auto-Summary scenario: R1 AS1 redistributes connected with auto-summary, R2 AS2 learns 1.0.0.0/8. IOSv 15.9(3)M9.'
  notes: ''
  title: BGP auto-summary test (lab-402)
  version: 0.3.1

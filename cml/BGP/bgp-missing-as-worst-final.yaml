lab:
  description: BGP bestpath MED missing-as-worst lesson, final state. R1 (AS 1) receives
    4.4.4.4/32 from R2 (AS 2, MED 100) and R3 (AS 2, no MED). R1 has bgp bestpath
    med missing-as-worst. R4 (AS 4) originates the prefix.
  notes: ''
  title: bgp-missing-as-worst
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1

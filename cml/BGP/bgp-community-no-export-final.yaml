lab:
  description: 'BGP Community No-Export (bgp-community-no-export): final configuration. R1 AS 1 sets no-export on 1.1.1.1/32 towards R2 (AS 24); R2 advertises it to iBGP peer R4 but not to eBGP peer R3. IOSv.'
  notes: ''
  title: BGP Community No-Export
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1

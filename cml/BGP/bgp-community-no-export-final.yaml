nodes:
  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |
          hostname R1
          !
          no ip domain lookup
          !
          ip cef
          !
          interface Loopback0
           ip address 1.1.1.1 255.255.255.255
          !
          interface GigabitEthernet0/0
           ip address 192.168.12.1 255.255.255.0
           no shutdown
          !
          router bgp 1
           bgp log-neighbor-changes
           network 1.1.1.1 mask 255.255.255.255
           neighbor 192.168.12.2 remote-as 24
           neighbor 192.168.12.2 send-community
           neighbor 192.168.12.2 route-map NO_EXPORT out
          !
          route-map NO_EXPORT permit 10
           set community no-export
          !
          line con 0
           exec-timeout 0 0
           logging synchronous
          !
          end
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n0
    image_definition: null
    label: R1
    node_definition: iosv
    parameters: {}
    priority: null
    pyats:
      username: null
      password: null
      enable_password: null
    ram: null
    tags: []
    x: -300
    y: 0
    interfaces:
      - id: i0
        label: Loopback0
        mac_address: null
        type: loopback
      - id: i1
        label: GigabitEthernet0/0
        mac_address: null
        type: physical
        slot: 0

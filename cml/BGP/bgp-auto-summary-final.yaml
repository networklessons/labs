annotations: []
nodes:
  - configuration:
      - name: ios_config.txt
        content: |-
          hostname R1
          no ip domain-lookup
          interface Loopback0
           ip address 1.1.1.1 255.255.255.255
          interface Loopback1
           ip address 172.16.10.1 255.255.255.0
          interface Loopback2
           ip address 172.18.1.1 255.255.255.0
          interface GigabitEthernet0/0
           ip address 192.168.12.1 255.255.255.0
           no shutdown
          ip route 10.10.10.0 255.255.255.0 Null0
          router ospf 1
           network 192.168.12.0 0.0.0.255 area 0
          router bgp 1
           neighbor 192.168.12.2 remote-as 2
           redistribute connected
           auto-summary
          line con 0
           exec-timeout 0 0
           logging synchronous
          end
    id: n0
    label: R1
    node_definition: iosv
    x: 0
    y: 0
    interfaces:
      - id: i0
        label: Loopback0
        type: loopback
      - id: i1
        label: GigabitEthernet0/0
        type: physical
        slot: 0
  - configuration:
      - name: ios_config.txt
        content: |-
          hostname R2
          no ip domain-lookup
          interface Loopback1
           ip address 172.20.30.1 255.255.255.0
           ip ospf network point-to-point
          interface GigabitEthernet0/0
           ip address 192.168.12.2 255.255.255.0
           no shutdown
          router ospf 1
           network 192.168.12.0 0.0.0.255 area 0
           network 172.20.30.0 0.0.0.255 area 0
          router bgp 2
           neighbor 192.168.12.1 remote-as 1
          line con 0
           exec-timeout 0 0
           logging synchronous
          end
    id: n1
    label: R2
    node_definition: iosv
    x: 200
    y: 0
    interfaces:
      - id: i0
        label: Loopback0
        type: loopback
      - id: i1
        label: GigabitEthernet0/0
        type: physical
        slot: 0
links:
  - id: l0
    n1: n0
    n2: n1
    i1: i1
    i2: i1
    label: R1-GigabitEthernet0/0<->R2-GigabitEthernet0/0
lab:
  description: 'bgp-auto-summary (post 7466) lab-415: R1 AS1, R2 AS2 eBGP. Final state: R1 auto-summary + redistribute connected, R2 learns 1.0.0.0, 172.16.0.0, 172.18.0.0, 192.168.12.0. Also tested: network 1.0.0.0, network 172.18.1.0 mask, redistribute static (10.10.10.0/24) and ospf 1 (172.20.30.0/24). IOSv 15.9(3)M9.'
  notes: ''
  title: BGP auto-summary test (lab-415)
  version: 0.3.1

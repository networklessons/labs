lab:
  description: 'HQ and Branch: HQ Gi0/0 192.168.12.1 - Branch Gi0/0 192.168.12.2,
    Branch Gi0/1 2.2.2.2/24. Static route 2.2.2.0/24 on HQ. Recapture of post 608
    (how-to-configure-static-route-on-cisco-ios-router). IOSv 15.9. SW1 (unmanaged
    switch) on Branch Gi0/1 only keeps the 2.2.2.0/24 stub interface up.'
  notes: ''

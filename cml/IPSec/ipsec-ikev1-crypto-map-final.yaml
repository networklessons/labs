annotations: []
smart_annotations: []
nodes:
  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |
          hostname R1
          !
          no ip domain lookup
          !
          crypto isakmp policy 10
           encr aes
           hash sha
           authentication pre-share
           group 2
          crypto isakmp key NWL address 192.168.12.2
          !
          crypto ipsec transform-set TS esp-aes esp-sha-hmac
           mode tunnel
          !
          crypto map CM 10 ipsec-isakmp
           set peer 192.168.12.2
           set transform-set TS
           match address 100
          !
          interface Loopback0
           ip address 1.1.1.1 255.255.255.255
          !
          interface GigabitEthernet0/0
           ip address 192.168.12.1 255.255.255.0
           crypto map CM
           no shutdown
          !
          ip route 2.2.2.2 255.255.255.255 192.168.12.2
          !
          access-list 100 permit ip host 1.1.1.1 host 2.2.2.2
          !
          line con 0
           exec-timeout 0 0
           logging synchronous
          !
          end
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n0
    image_definition: null
    label: R1
    node_definition: iosv
    parameters: {}
    priority: null
    pyats:
      username: null
      password: null
      enable_password: null
    ram: null
    tags: []
    x: 0
    y: 0
    interfaces:

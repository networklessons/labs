lab:
  title: IS-IS metric narrow re-capture (lab-353)
  description: 'is-is-metric-on-cisco-ios (post 45180): R1-R2-R4-R3 square, IS-IS L1 area 49.1234, default narrow metrics. IOSv 15.9.'
  notes: ''
  version: 0.2.2
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 0
  y: 0
  configuration: "hostname R1\nno ip domain-lookup\nip cef\n!\ninterface GigabitEthernet0/1\n ip address 192.168.12.1 255.255.255.0\n ip router isis \n no shutdown\n!\ninterface GigabitEthernet0/2\n ip address 192.168.13.1 255.255.255.0\n ip router isis \n no shutdown\n!\nrouter isis\n net 49.1234.0000.0000.0001.00\n is-type level-1\n log-adjacency-changes\n!\nline con 0\n exec-timeout 0 0\n logging synchronous\n!\nend\n"
  interfaces:
  - id: n0i0

      \ level-1\n log-adjacency-changes\n!\nline con 0\n exec-timeout 0 0\n logging\
      \ synchronous\n!\nend\n"
  interfaces:
  - id: i0
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i1
    label: GigabitEthernet0/1

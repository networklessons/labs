lab:
  title: 'IS-IS Route Leaking (final, reduced: R1 R2 R4 R7 R8)'
  description: 'is-is-route-leaking (post 45761): R1-R2-R4 area 1234 L1 (R4 L1-L2),
    R7 L1-L2 + R8 L1 area 5678. R3/R5/R6 left out. IOSv 15.9. R4 Gi0/1 MAC 5254.00ff.0004
    so R4 is DIS on the R2-R4 LAN, as in the lesson (R4.01).'
  version: 0.2.2
  notes: ''
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 0
  y: 0
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain lookup\nip cef\n!\ninterface GigabitEthernet0/1\n\
      \ ip address 192.168.12.1 255.255.255.0\n ip router isis\n no shutdown\n!\n\
      interface GigabitEthernet0/2\n ip address 192.168.13.1 255.255.255.0\n ip router\
      \ isis\n no shutdown\n!\nrouter isis\n net 49.1234.0000.0000.0001.00\n is-type\
      \ level-1\n log-adjacency-changes\n!\nline con 0\n exec-timeout 0 0\n logging\
      \ synchronous\n!\nend\n"
  interfaces:
  - id: i0
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i1
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i2
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: i3
    label: GigabitEthernet0/3
    slot: 3
    type: physical

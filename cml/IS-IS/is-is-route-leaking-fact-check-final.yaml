      \ isis\n no shutdown\n!\nrouter isis\n net 49.1234.0000.0000.0004.00\n log-adjacency-changes\n\
      \ redistribute isis ip level-2 into level-1 route-map ROUTE_LEAKING\n!\nip access-list\
      \ extended R8_L0\n permit ip host 8.8.8.8 any\n!\nroute-map ROUTE_LEAKING permit\

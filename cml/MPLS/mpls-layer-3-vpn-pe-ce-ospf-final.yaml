lab:
  title: mpls-layer-3-vpn-pe-ce-ospf-gigabit-final
  description: "mpls-layer-3-vpn-pe-ce-ospf (post 9932) recapture on IOSv 15.9(3)M9, final lesson config (PE2 back on ospf 2, before the NSSA proof). CE1 Gi0/0 - Gi0/0 PE1 Gi0/1 - Gi0/0 P Gi0/1 - Gi0/0 PE2 Gi0/1 - Gi0/0 CE2."
  version: 0.2.2
nodes:
  - id: n0
    label: CE1
    node_definition: iosv
    x: 0
    y: 0
    configuration: |-
      !
      !
      version 15.9
      service timestamps debug datetime msec
      service timestamps log datetime msec
      no service password-encryption
      !
      hostname CE1
      !
      boot-start-marker
      boot-end-marker
      !
      no logging console
      !
      no aaa new-model
      !
      mmi polling-interval 60
      no mmi auto-configure
      no mmi pvc
      mmi snmp-timeout 180
      !
      no ip domain lookup
      ip cef
      no ipv6 cef
      !
      multilink bundle-name authenticated
      !
      redundancy
      !
      interface Loopback0
       ip address 1.1.1.1 255.255.255.255
      !
      interface GigabitEthernet0/0
       no shutdown
       ip address 192.168.12.1 255.255.255.0
       duplex auto
       speed auto
       media-type rj45
      !
      interface GigabitEthernet0/1
       no ip address
       shutdown
       duplex auto
       speed auto
       media-type rj45
      !
      router ospf 1
       network 1.1.1.1 0.0.0.0 area 0
       network 192.168.12.0 0.0.0.255 area 0
      !
      ip forward-protocol nd
      !
      no ip http server
      no ip http secure-server
      !
      ipv6 ioam timestamp
      !
      control-plane
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
      line aux 0
      line vty 0 4
       exec-timeout 0 0
       login

       transport input none
      !
      no scheduler allocate
      !
      end
    interfaces:
      - {id: i0, label: GigabitEthernet0/0, slot: 0, type: physical}
      - {id: i1, label: GigabitEthernet0/1, slot: 1, type: physical}
  - id: n1
    label: PE1
    node_definition: iosv
    x: 200
    y: 0
    configuration: |-
      !
      !
      version 15.9
      service timestamps debug datetime msec
      service timestamps log datetime msec
      no service password-encryption
      !
      hostname PE1
      !
      boot-start-marker
      boot-end-marker
      !
      no logging console
      !
      no aaa new-model
      !
      mmi polling-interval 60
      no mmi auto-configure
      no mmi pvc
      mmi snmp-timeout 180
      !
      ip vrf CUSTOMER
       rd 1:1
       route-target export 1:1
       route-target import 1:1
      !
      no ip domain lookup
      ip cef
      no ipv6 cef
      !
      multilink bundle-name authenticated
      !
      redundancy
      !
      interface Loopback0
       ip address 2.2.2.2 255.255.255.255
      !
      interface GigabitEthernet0/0
       no shutdown
       ip vrf forwarding CUSTOMER
       ip address 192.168.12.2 255.255.255.0
       duplex auto
       speed auto
       media-type rj45

      !
      interface GigabitEthernet0/1
       no shutdown
       ip address 192.168.23.2 255.255.255.0
       duplex auto
       speed auto
       media-type rj45
      !
      router ospf 2 vrf CUSTOMER
       redistribute bgp 234 subnets
       network 192.168.12.0 0.0.0.255 area 0
      !
      router ospf 1
       mpls ldp autoconfig
       network 2.2.2.2 0.0.0.0 area 0
       network 192.168.23.0 0.0.0.255 area 0
      !
      router bgp 234
       bgp log-neighbor-changes
       neighbor 4.4.4.4 remote-as 234
       neighbor 4.4.4.4 update-source Loopback0
       !
       address-family vpnv4
        neighbor 4.4.4.4 activate
        neighbor 4.4.4.4 send-community extended
       exit-address-family
       !
       address-family ipv4 vrf CUSTOMER
        redistribute ospf 2
       exit-address-family
      !
      ip forward-protocol nd

      !
      no ip http server
      no ip http secure-server
      !
      ipv6 ioam timestamp
      !
      control-plane
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
      line aux 0
      line vty 0 4
       exec-timeout 0 0
       login
       transport input none
      !
      no scheduler allocate
      !
      end
    interfaces:
      - {id: i0, label: GigabitEthernet0/0, slot: 0, type: physical}
      - {id: i1, label: GigabitEthernet0/1, slot: 1, type: physical}

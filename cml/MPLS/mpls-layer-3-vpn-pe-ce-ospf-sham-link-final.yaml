lab:
  title: "MPLS L3VPN OSPF sham-link re-capture (rc-319)"
  description: "mpls-layer-3-vpn-pe-ce-ospf-sham-link (post 47302): CE1-PE1-P-PE2-CE2, CE1-CE2 backdoor Gi0/2, sham-link cost 10. IOSv 15.9."
  notes: ""
  version: 0.2.2
nodes:
  - id: n0
    label: CE1
    node_definition: iosv
    x: 0
    y: 0
    configuration: |
      hostname CE1
      !
      ip cef
      no ip domain lookup
      logging buffered 512000
      no logging console
      !
      interface Loopback0
       ip address 1.1.1.1 255.255.255.255
      !
      interface GigabitEthernet0/1
       ip address 192.168.12.1 255.255.255.0
      !
      interface GigabitEthernet0/2
       ip address 192.168.15.1 255.255.255.0
       ip ospf cost 100
      !
      router ospf 1
       network 1.1.1.1 0.0.0.0 area 0
       network 192.168.12.0 0.0.0.255 area 0
       network 192.168.15.0 0.0.0.255 area 0
      !
      line con 0
       exec-timeout 0 0
      !
      end
    interfaces:
      - id: i0
        label: GigabitEthernet0/0
        slot: 0
        type: physical
      - id: i1
        label: GigabitEthernet0/1
        slot: 1
        type: physical
      - id: i2
        label: GigabitEthernet0/2
        slot: 2
        type: physical
      - id: i3
        label: GigabitEthernet0/3
        slot: 3
        type: physical
  - id: n1
    label: PE1
    node_definition: iosv
    x: 200
    y: 0
    configuration: |
      hostname PE1
      !
      ip vrf CUSTOMER
       rd 1:1
       route-target export 1:1
       route-target import 1:1
      !
      ip cef
      no ip domain lookup
      logging buffered 512000
      no logging console
      !
      interface Loopback0
       ip address 2.2.2.2 255.255.255.255
      !
      interface Loopback1
       ip vrf forwarding CUSTOMER
       ip address 22.22.22.22 255.255.255.255
      !
      interface GigabitEthernet0/1
       ip vrf forwarding CUSTOMER
       ip address 192.168.12.2 255.255.255.0
      !
      interface GigabitEthernet0/2
       ip address 192.168.23.2 255.255.255.0
      !
      router ospf 2 vrf CUSTOMER
       area 0 sham-link 22.22.22.22 44.44.44.44 cost 10
       redistribute bgp 234 subnets
       network 192.168.12.0 0.0.0.255 area 0
      !
      router ospf 1
       mpls ldp autoconfig
       network 2.2.2.2 0.0.0.0 area 0
       network 192.168.23.0 0.0.0.255 area 0
      !
      router bgp 234
       bgp log-neighbor-changes
       neighbor 4.4.4.4 remote-as 234
       neighbor 4.4.4.4 update-source Loopback0
       !
       address-family ipv4
        no neighbor 4.4.4.4 activate
       exit-address-family
       !
       address-family vpnv4
        neighbor 4.4.4.4 activate
        neighbor 4.4.4.4 send-community extended
       exit-address-family
       !
       address-family ipv4 vrf CUSTOMER
        network 22.22.22.22 mask 255.255.255.255
        redistribute ospf 2
       exit-address-family
      !
      line con 0
       exec-timeout 0 0
      !
      end
    interfaces:
      - id: i0
        label: GigabitEthernet0/0
        slot: 0
        type: physical
      - id: i1
        label: GigabitEthernet0/1
        slot: 1
        type: physical
      - id: i2
        label: GigabitEthernet0/2
        slot: 2
        type: physical
      - id: i3
        label: GigabitEthernet0/3
        slot: 3
        type: physical

# lab-464 (CML lab c91e67e6-5fbd-46aa-bd96-8be2aa3427c9, deleted after the test)
# cEdge2 = cat-sdwan-edge, IOS XE 17.16.1a, controller mode, no controllers (standalone).
# cEdge2 config was applied over the console with config-transaction (commit):
#   system / system-ip 172.16.1.2 / site-id 2 / organization-name nwl-lab-sdwan
#   vrf definition 10 / rd 1:10 / address-family ipv4
#   interface GigabitEthernet3: vrf forwarding 10, ip address 10.2.0.254 255.255.255.0, no shutdown
#   interface GigabitEthernet4: vrf forwarding 10, ip address 10.3.0.254 255.255.255.0, no shutdown
#   policy
#    policer POLICER / rate 15000 / burst 15000 / exceed drop   (rate 8000 for the second test)
#    lists / data-prefix-list SITE2-PREFIX / ip-prefix 10.2.0.0/24
#    access-list SITE2-POLICER / sequence 1 / match source-data-prefix-list SITE2-PREFIX
#      / action accept / count COUNTER1 / policer POLICER / default-action accept
#   sdwan / interface GigabitEthernet3 / access-list SITE2-POLICER in
annotations: []
nodes:
  - id: n0
    label: SW2
    node_definition: iosvl2
    x: -200
    y: 0
    configuration: |-
      hostname SW2
      no ip routing
      no ip domain-lookup
      interface GigabitEthernet0/0
       no switchport
       ip address 10.2.0.102 255.255.255.0
       no shutdown
      ip default-gateway 10.2.0.254
      line con 0
       exec-timeout 0 0
      end
    interfaces:
      - {id: i1, label: GigabitEthernet0/0, type: physical, slot: 0}
  - id: n1
    label: SW3
    node_definition: iosvl2
    x: 200
    y: 0
    configuration: |-
      hostname SW3
      no ip routing
      no ip domain-lookup
      interface GigabitEthernet0/0
       no switchport
       ip address 10.3.0.103 255.255.255.0
       no shutdown
      ip default-gateway 10.3.0.254
      line con 0
       exec-timeout 0 0
      end
    interfaces:
      - {id: i1, label: GigabitEthernet0/0, type: physical, slot: 0}
  - id: n2
    label: cEdge2
    node_definition: cat-sdwan-edge
    x: 0
    y: 0
    interfaces:
      - {id: i1, label: GigabitEthernet1, type: physical, slot: 0}
      - {id: i2, label: GigabitEthernet2, type: physical, slot: 1}
      - {id: i3, label: GigabitEthernet3, type: physical, slot: 2}
      - {id: i4, label: GigabitEthernet4, type: physical, slot: 3}
links:
  - {id: l0, n1: n0, n2: n2, i1: i1, i2: i3}
  - {id: l1, n1: n1, n2: n2, i1: i1, i2: i4}
lab:
  title: SD-WAN policer test (lab-464)
  description: "post 65781 B4b: cEdge2 standalone (Catalyst SD-WAN Edge 17.16.1a), localized ACL + policer via CLI on Gi3 in; SW2 Gi3 / SW3 Gi4 in VRF 10."
  version: 0.3.1

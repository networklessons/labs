lab:
  title: Troubleshooting CCNP TSHOOT lab full (lab-347)
  description: 'troubleshooting-ccnp-tshoot-lab (post 7133), full topology incl. serial/frame-relay (FRSW). State: tickets 1-3 fixed, ticket 4 (R4 Tunnel34 OSPFv3 non-broadcast) still broken. IOL XE 17.18 (routers, serial variant), IOL-L2 (switches), IOL XE hosts. 14 licensed nodes.'
  notes: Lesson Fa1/n on switches = Ethernet(1+n//4)/(n%4); router S0/0 = Serial1/0, S0/1 = Serial1/1; R4 Fa1/0 = Et0/0, Fa2/0 = Et0/1; ASW2 Fa1/0/1 = Et1/0. FR DLCIs 102/201, 203/302, 304/403 are assumptions.
  version: 0.3.1

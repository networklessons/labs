annotations: []
nodes:
- id: n0
  label: R1
  node_definition: iol-xe-serial-4eth
  x: 600
  y: -450
  configuration:
  - name: ios_config.txt
    content: |-
      hostname R1
      !
      no ip domain lookup
      ipv6 unicast-routing
      !
      interface Serial1/0
       description S0/0 in the lesson (frame-relay)
       no ip address
       encapsulation frame-relay
       no shutdown
      !
      interface Serial1/0.12 point-to-point
       description S0/0.12 in the lesson
       ip address 10.1.1.1 255.255.255.252
       ip nat inside
       ipv6 address 2026::12:1/122
       ipv6 ospf 6 area 12
       frame-relay interface-dlci 102
      !
      interface Serial1/1
       description S0/1 in the lesson, to ISP
       ip address 209.65.200.225 255.255.255.252
       ip nat outside
       no shutdown
      !
      interface Ethernet0/0
       no ip address
       shutdown
      !
      interface Ethernet0/1
       no ip address
       shutdown
      !
      interface Ethernet0/2
       no ip address
       shutdown
      !
      interface Ethernet0/3
       no ip address
       shutdown
      !
      interface Serial1/2
       no ip address
       shutdown
      !
      interface Serial1/3
       no ip address
       shutdown
      !
      router ospf 1
       redistribute bgp 65001 subnets
       passive-interface Serial1/1
       network 10.1.1.1 0.0.0.0 area 12
       network 209.65.200.224 0.0.0.3 area 12
      !
      router bgp 65001
       neighbor 209.65.200.226 remote-as 65002
      !
      ipv6 router ospf 6
      !
      ip nat pool TSHOOT 209.65.200.225 209.65.200.225 netmask 255.255.255.252
      ip nat inside source list 1 pool TSHOOT overload
      !
      ip access-list standard 1
       10 permit 10.0.0.0 0.255.255.255
       20 permit 192.168.0.0 0.0.255.255
      !
      line con 0
       exec-timeout 0 0
       logging synchronous
      !
      end

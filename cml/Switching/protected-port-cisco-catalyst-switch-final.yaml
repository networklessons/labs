lab:
  title: protected-port-cisco-catalyst-switch final (lab-434)
  description: "protected-port-cisco-catalyst-switch (post 4338): H1/H2/H3 IOL XE on SW1 IOSvL2 Gi0/1-3, 192.168.1.0/24"
  notes: ''
  version: 0.3.0
nodes:
  - id: n0
    label: SW1
    node_definition: iosvl2
    x: 0
    y: 0
    configuration: |-
      hostname SW1
      no ip domain-lookup
      interface GigabitEthernet0/1
       switchport protected
      interface GigabitEthernet0/3
       switchport protected
      line con 0
       exec-timeout 0 0
       logging synchronous
      end
    interfaces:
      - {id: i0, label: GigabitEthernet0/0, slot: 0, type: physical}
      - {id: i1, label: GigabitEthernet0/1, slot: 1, type: physical}
      - {id: i2, label: GigabitEthernet0/2, slot: 2, type: physical}
      - {id: i3, label: GigabitEthernet0/3, slot: 3, type: physical}
  - id: n1
    label: H1
    node_definition: iol-xe
    x: -200
    y: 200
    configuration: |-
      hostname H1
      no ip routing
      no ip domain-lookup
      interface Ethernet0/0
       ip address 192.168.1.1 255.255.255.0
       no shutdown
      line con 0
       exec-timeout 0 0
       logging synchronous
      end
    interfaces:
      - {id: i0, label: Ethernet0/0, slot: 0, type: physical}
  - id: n2
    label: H2
    node_definition: iol-xe
    x: 0
    y: 200
    configuration: |-
      hostname H2
      no ip routing
      no ip domain-lookup
      interface Ethernet0/0
       ip address 192.168.1.2 255.255.255.0
       no shutdown
      line con 0
       exec-timeout 0 0
       logging synchronous
      end
    interfaces:
      - {id: i0, label: Ethernet0/0, slot: 0, type: physical}
  - id: n3
    label: H3
    node_definition: iol-xe
    x: 200
    y: 200
    configuration: |-
      hostname H3
      no ip routing
      no ip domain-lookup
      interface Ethernet0/0
       ip address 192.168.1.3 255.255.255.0
       no shutdown
      line con 0
       exec-timeout 0 0
       logging synchronous
      end
    interfaces:
      - {id: i0, label: Ethernet0/0, slot: 0, type: physical}
links:
  - {id: l0, i1: i1, n1: n0, i2: i0, n2: n1}
  - {id: l1, i1: i2, n1: n0, i2: i0, n2: n2}
  - {id: l2, i1: i3, n1: n0, i2: i0, n2: n3}

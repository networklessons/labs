lab:
  description: 'VTP Version 3: SW1, SW2, SW3 IOSvL2 in a line, domain NWL, VTP version
    3, MST mode'
  notes: |-
    Lesson: https://networklessons.com/switching/vtp-version-3

    Links (dot1q trunks):
    - SW1 Gi0/1 - SW2 Gi0/1
    - SW2 Gi0/2 - SW3 Gi0/1

    The startup configs set domain NWL, VTP version 3, the MST feature modes (SW2 server, SW1 and SW3 client) and spanning-tree mode mst.

    Primary server roles, VLANs and the MST configuration can't be in a startup config: they need a primary server first, and SW2 rejects the MST configuration at boot. Run these after boot:
    - SW1: vtp primary
    - SW2: vtp primary mst
    - SW2: spanning-tree mst configuration, name MST, revision 1, instance 1 vlan 10,20,30, instance 2 vlan 40,50,60
    - SW1: vlan 100, vlan 1234, vlan 501 (community), vlan 502 (isolated), vlan 500 (primary, private-vlan association add 501,502), vlan 600 (remote-span)

    Left out on purpose so the switches keep synchronizing: the lesson's last steps, vtp password, vtp mode off vlan and no vtp on SW3 Gi0/1.

    On this IOSvL2 image, two separate private-vlan association add commands in one VLAN session keep only the last one. Use one command: private-vlan association add 501,502.
  title: VTP Version 3
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1

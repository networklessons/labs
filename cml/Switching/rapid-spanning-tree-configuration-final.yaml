lab:
  description: 'Rapid Spanning Tree Configuration lesson (end state: SW2 in PVST mode, H1 port is portfast). All switches use priority 32768, so start SW1, then SW2, then SW3: IOL gets its MAC at start, and SW1 needs the lowest one to become root.'
  notes: HUB1 and HUB2 are unmanaged switches in hub mode. With the HUB1-HUB2 link stopped, they act as two separate SW2-SW3 links. With it started and Et0/3 enabled on SW2 and SW3 (plus spanning-tree link-type shared), they form the shared segment of the hub section. IOL does not signal link loss to the other end, so shut both ends to simulate a failure.
  title: rapid-spanning-tree-configuration
  version: 0.3.0

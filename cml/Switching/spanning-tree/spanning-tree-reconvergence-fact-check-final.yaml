lab:
  title: spanning-tree-reconvergence re-capture (lab-474)
  description: 'spanning-tree-reconvergence (post 25788): SW1-SW5 IOSvL2 ring, SW1 root (priority 0). SW1 Gi0/1-SW2 Gi0/1, SW1 Gi0/2-SW3 Gi0/1, SW2 Gi0/2-SW4 Gi0/1, SW3 Gi0/2-SW5 Gi0/1, SW4 Gi0/2-SW5 Gi0/2. Gi0/0-0/2 MACs 5254.00 + the last 3 bytes of the lesson MAC diagram (CML only allows the 52:54:00 OUI). NTP from SW1 Vlan1. Note: Vlan1 needed shutdown/no shutdown after boot before NTP worked.'
  notes: ''
  version: 0.3.0
nodes:
  - id: n0
    label: SW1
    node_definition: iosvl2
    x: 0
    y: -200
    configuration: |-
      hostname SW1
      no ip domain-lookup
      service timestamps debug datetime msec
      service timestamps log datetime msec
      logging discriminator NOCFG mnemonics drops CONFIG_I
      logging buffered discriminator NOCFG 512000 debugging
      no logging console
      spanning-tree mode pvst
      spanning-tree vlan 1 priority 0
      interface GigabitEthernet0/0
       shutdown
      interface GigabitEthernet0/3
       shutdown
      interface Vlan1
       ip address 192.168.1.1 255.255.255.0
       no shutdown
      ntp master 1
      line con 0
       exec-timeout 0 0
       logging synchronous
      end
    interfaces:
      - {id: i0, label: GigabitEthernet0/0, slot: 0, type: physical, mac_address: '52:54:00:ca:40:96'}
      - {id: i1, label: GigabitEthernet0/1, slot: 1, type: physical, mac_address: '52:54:00:a9:6a:7e'}
      - {id: i2, label: GigabitEthernet0/2, slot: 2, type: physical, mac_address: '52:54:00:44:2b:9d'}
      - {id: i3, label: GigabitEthernet0/3, slot: 3, type: physical}

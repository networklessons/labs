lab:
  description: 'VTP Client Overwrites VTP Server: final configuration'
  notes: |-
    Lesson: https://networklessons.com/switching/vtp-client-overwrites-vtp-server

    Final state of the lesson (IOSvL2, VTP version 2, domain NWL):
    - SW1: VTP server. VLANs 100-500 (LAB100-LAB500) are the VLANs it learned from SW3.
    - SW2: VTP client, learns the VLAN database (and VTP version 2) from SW1.
      Its config has no "vtp version 2" on purpose: that command raises the
      revision to 1 before the switch becomes a client, which would block the sync.
    - SW3: VTP transparent mode (configuration revision 0), as at the end of "How to prevent this".

    VTP server and client modes don't store VLANs in the configuration, so the
    revision numbers after boot differ from the lesson output.
  title: VTP Client Overwrites Server
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1

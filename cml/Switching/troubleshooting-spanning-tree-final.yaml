lab:
  description: 'troubleshooting-spanning-tree (post 6997), final state of the lesson. SW1 (root for VLAN 1 and 10), SW2 and SW3 are IOL-L2 (IOS XE 17.18) with two links per pair: SW1 Et0/0-0/1 to SW2 Et0/0-0/1, SW1 Et0/2-0/3 to SW3 Et0/0-0/1, SW2 Et0/2-0/3 to SW3 Et0/2-0/3. 802.1Q trunks (ISL trunks between IOL-L2 nodes carried no VLAN 10 BPDUs).'
  notes: ''
  title: troubleshooting-spanning-tree recapture (lab-322)
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1

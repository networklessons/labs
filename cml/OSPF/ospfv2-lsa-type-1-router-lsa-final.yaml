lab:
  title: OSPF Router LSA re-capture (lab-485)
  description: 'ospfv2-lsa-type-1-router-lsa (post 85790): R1-R2 IOL XE 17.18.2 Et0/1 192.168.12.0/24 p2p, Lo0 1.1.1.1/2.2.2.2 advertised'
  version: 0.3.1
nodes:
  - id: n0
    label: R1
    node_definition: iol-xe
    x: 0
    y: 0
    configuration:
      - name: ios_config.txt
        content: |-
          hostname R1
          !
          ip cef
          !
          interface Loopback0
           ip address 1.1.1.1 255.255.255.255
          !
          interface Ethernet0/0
           no ip address
           shutdown
          !
          interface Ethernet0/1
           ip address 192.168.12.1 255.255.255.0
           ip ospf network point-to-point
          !
          interface Ethernet0/2
           no ip address
           shutdown
          !
          interface Ethernet0/3
           no ip address
           shutdown
          !
          router ospf 1
           network 1.1.1.1 0.0.0.0 area 0
           network 192.168.12.0 0.0.0.255 area 0
          !
          end
    interfaces:
      - {id: i0, label: Loopback0, type: loopback}
      - {id: i1, label: Ethernet0/0, type: physical, slot: 0}
      - {id: i2, label: Ethernet0/1, type: physical, slot: 1}
      - {id: i3, label: Ethernet0/2, type: physical, slot: 2}
      - {id: i4, label: Ethernet0/3, type: physical, slot: 3}
  - id: n1
    label: R2
    node_definition: iol-xe
    x: 300
    y: 0
    configuration:
      - name: ios_config.txt
        content: |-
          hostname R2
          !
          ip cef
          !
          interface Loopback0
           ip address 2.2.2.2 255.255.255.255
          !
          interface Ethernet0/0
           no ip address
           shutdown
          !
          interface Ethernet0/1
           ip address 192.168.12.2 255.255.255.0
           ip ospf network point-to-point
          !
          interface Ethernet0/2
           no ip address
           shutdown
          !
          interface Ethernet0/3
           no ip address
           shutdown
          !
          router ospf 1
           network 2.2.2.2 0.0.0.0 area 0
           network 192.168.12.0 0.0.0.255 area 0
          !
          end
    interfaces:
      - {id: i0, label: Loopback0, type: loopback}
      - {id: i1, label: Ethernet0/0, type: physical, slot: 0}
      - {id: i2, label: Ethernet0/1, type: physical, slot: 1}
      - {id: i3, label: Ethernet0/2, type: physical, slot: 2}
      - {id: i4, label: Ethernet0/3, type: physical, slot: 3}
links:
  - {id: l0, n1: n0, i1: i2, n2: n1, i2: i2, label: R1-Ethernet0/1<->R2-Ethernet0/1}

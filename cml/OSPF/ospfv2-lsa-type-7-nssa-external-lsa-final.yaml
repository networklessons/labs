lab:
  title: OSPF NSSA type 4 check (lab-387)
  description: 'ospfv2-lsa-type-7-nssa-external-lsa (post 85801): R1 (area 1 NSSA ASBR) - R2 (ABR 1/0) - R3 (ABR 0/2) - R4 (area 2). Does R4 get a type 4 for R2? IOL XE.'
  notes: ''
  version: 0.2.2
nodes:
- id: n0
  label: R1
  node_definition: iol-xe
  x: 0
  y: 0
  configuration: "hostname R1\n!\nip cef\n!\ninterface Loopback0\n ip address 11.11.11.11 255.255.255.255\n!\ninterface Ethernet0/1\n ip address 192.168.12.1 255.255.255.0\n ip ospf network point-to-point\n no shutdown\n!\nrouter ospf 1\n router-id 1.1.1.1\n area 1 nssa\n redistribute connected route-map CONNECTED_TO_OSPF\n network 192.168.12.0 0.0.0.255 area 1\n!\nip access-list standard R1_L0\n 10 permit 11.11.11.11\n!\nroute-map CONNECTED_TO_OSPF permit 10\n match ip address R1_L0\n!\nline con 0\n exec-timeout 0 0\n logging synchronous\n!\nend\n"
  interfaces:
  - id: n0i0
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: n0i1
    label: Ethernet0/1
    slot: 1
    type: physical
  - id: n0i2
    label: Ethernet0/2
    slot: 2
    type: physical
  - id: n0i3
    label: Ethernet0/3
    slot: 3
    type: physical
- id: n1
  label: R2
  node_definition: iol-xe
  x: 150
  y: 0
  configuration: "hostname R2\n!\nip cef\n!\ninterface Ethernet0/1\n ip address 192.168.12.2 255.255.255.0\n ip ospf network point-to-point\n no shutdown\n!\ninterface Ethernet0/2\n ip address 192.168.23.2 255.255.255.0\n ip ospf network point-to-point\n no shutdown\n!\nrouter ospf 1\n router-id 2.2.2.2\n area 1 nssa\n network 192.168.12.0 0.0.0.255 area 1\n network 192.168.23.0 0.0.0.255 area 0\n!\nline con 0\n exec-timeout 0 0\n logging synchronous\n!\nend\n"
  interfaces:
  - id: n1i0
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: n1i1
    label: Ethernet0/1
    slot: 1
    type: physical
  - id: n1i2
    label: Ethernet0/2
    slot: 2
    type: physical
  - id: n1i3
    label: Ethernet0/3
    slot: 3
    type: physical
- id: n2
  label: R3
  node_definition: iol-xe
  x: 300
  y: 0
  configuration: "hostname R3\n!\nip cef\n!\ninterface Ethernet0/1\n ip address 192.168.23.3 255.255.255.0\n ip ospf network point-to-point\n no shutdown\n!\ninterface Ethernet0/2\n ip address 192.168.34.3 255.255.255.0\n ip ospf network point-to-point\n no shutdown\n!\nrouter ospf 1\n router-id 3.3.3.3\n network 192.168.23.0 0.0.0.255 area 0\n network 192.168.34.0 0.0.0.255 area 2\n!\nline con 0\n exec-timeout 0 0\n logging synchronous\n!\nend\n"
  interfaces:
  - id: n2i0
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: n2i1
    label: Ethernet0/1
    slot: 1
    type: physical

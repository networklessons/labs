annotations: []
nodes:
  - configuration:
      - name: ios_config.txt
        content: |-
          hostname R1
          no ip domain-lookup
          interface Loopback0
           ip address 1.1.1.1 255.255.255.0
          interface Loopback1
           ip address 11.0.0.1 255.0.0.0
          interface Loopback2
           ip address 192.168.1.1 255.255.255.0
          interface GigabitEthernet0/0
           ip address 192.168.12.1 255.255.255.0
           no shutdown
          ip route 172.16.0.0 255.255.0.0 Null0
          ip route 172.17.1.0 255.255.255.0 Null0
          router ospf 1
           redistribute connected
           redistribute static
           network 192.168.12.0 0.0.0.255 area 0
          line con 0
           exec-timeout 0 0
           logging synchronous
          end
    id: n0
    label: R1
    node_definition: iosv
    x: 0
    y: 0
    interfaces:
      - id: i0
        label: Loopback0
        type: loopback
      - id: i1
        label: GigabitEthernet0/0
        type: physical
        slot: 0
  - configuration:
      - name: ios_config.txt
        content: |-
          hostname R2
          no ip domain-lookup
          interface Loopback0
           ip address 2.2.2.2 255.255.255.0
          interface Loopback1
           ip address 22.0.0.2 255.0.0.0
          interface Loopback2
           ip address 192.168.2.2 255.255.255.0
          interface Ethernet0/0
           ip address 192.168.12.2 255.255.255.0
           no shutdown
          ip route 172.18.0.0 255.255.0.0 Null0
          ip route 172.19.1.0 255.255.255.0 Null0
          router ospf 1
           redistribute connected
           redistribute static
           network 192.168.12.0 0.0.0.255 area 0
          line con 0
           exec-timeout 0 0
           logging synchronous
          end
    id: n1
    label: R2
    node_definition: iol-xe
    x: 200
    y: 0
    interfaces:
      - id: i0
        label: Loopback0
        type: loopback
      - id: i1
        label: Ethernet0/0
        type: physical
        slot: 0
links:
  - id: l0
    n1: n0
    n2: n1
    i1: i1
    i2: i1
    label: R1-GigabitEthernet0/0<->R2-Ethernet0/0

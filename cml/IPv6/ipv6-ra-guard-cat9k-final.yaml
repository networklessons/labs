lab:
  title: IPv6 RA guard RS forwarding Cat9000v (lab-363)
  description: "ipv6-ra-guard (post 55728) re-test on Cat9000v UADP: does SW1 forward H1's RS to R1 (Gi1/0/3, no policy vs device-role router) and to H2 (Gi1/0/2, HOSTS)? H1 Gi1/0/1, VLAN 123. R1/H1/H2 IOSv Gi0/1."
  version: 0.2.2
  notes: ""
annotations: []
nodes:
  - id: n0
    label: SW1
    node_definition: cat9000v-uadp
    x: 0
    y: 0
    configuration:
      - name: iosxe_config.txt
        content: |-
          hostname SW1
          no ip domain lookup
          no logging console
          logging buffered 64000 debugging
          no service timestamps debug
          vlan 123
          ipv6 nd raguard policy HOSTS
           device-role host
          interface GigabitEthernet1/0/1
           switchport mode access
           switchport access vlan 123
           spanning-tree portfast
           no shutdown
          interface GigabitEthernet1/0/2
           switchport mode access
           switchport access vlan 123
           spanning-tree portfast
           ipv6 nd raguard attach-policy HOSTS
           no shutdown
          interface GigabitEthernet1/0/3
           switchport mode access
           switchport access vlan 123
           spanning-tree portfast
           no shutdown
          line con 0
           exec-timeout 0 0
           logging synchronous
          end
    interfaces:
      - {id: i0, label: Loopback0, type: loopback}
      - {id: i1, label: GigabitEthernet0/0, type: physical, slot: 0}
      - {id: i2, label: GigabitEthernet1/0/1, type: physical, slot: 1}
      - {id: i3, label: GigabitEthernet1/0/2, type: physical, slot: 2}
      - {id: i4, label: GigabitEthernet1/0/3, type: physical, slot: 3}
  - id: n1
    label: R1
    node_definition: iosv
    x: 200
    y: -100
    configuration:
      - name: ios_config.txt
        content: |-
          hostname R1
          no ip domain lookup
          no logging console
          logging buffered 64000 debugging
          no service timestamps debug
          ipv6 unicast-routing
          interface GigabitEthernet0/1
           ipv6 address 2001:DB8:0:1::1/64
           no shutdown
          line con 0
           exec-timeout 0 0
          end
    interfaces:
      - {id: i0, label: GigabitEthernet0/0, type: physical, slot: 0}
      - {id: i1, label: GigabitEthernet0/1, type: physical, slot: 1}
  - id: n2
    label: H1
    node_definition: iosv
    x: -200
    y: -100
    configuration:
      - name: ios_config.txt
        content: |-
          hostname H1
          no ip domain lookup
          no logging console
          logging buffered 64000 debugging
          no service timestamps debug
          interface GigabitEthernet0/1
           ipv6 address autoconfig default
           no shutdown
          line con 0
           exec-timeout 0 0
          end
    interfaces:
      - {id: i0, label: GigabitEthernet0/0, type: physical, slot: 0}
      - {id: i1, label: GigabitEthernet0/1, type: physical, slot: 1}
  - id: n3
    label: H2
    node_definition: iosv
    x: 0
    y: 150
    configuration:
      - name: ios_config.txt
        content: |-
          hostname H2
          no ip domain lookup
          no logging console
          logging buffered 64000 debugging
          no service timestamps debug
          ipv6 unicast-routing
          interface GigabitEthernet0/1
           ipv6 address 2001:DB8:BAD:BAD::2/64
           ipv6 nd router-preference high
           no shutdown
          line con 0
           exec-timeout 0 0
          end
    interfaces:
      - {id: i0, label: GigabitEthernet0/0, type: physical, slot: 0}
      - {id: i1, label: GigabitEthernet0/1, type: physical, slot: 1}
links:
  - {id: l0, n1: n0, i1: i2, n2: n2, i2: i1}
  - {id: l1, n1: n0, i1: i3, n2: n3, i2: i1}
  - {id: l2, n1: n0, i1: i4, n2: n1, i2: i1}

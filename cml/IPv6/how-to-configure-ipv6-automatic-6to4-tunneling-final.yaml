lab:
  title: 6to4 ping re-capture (lab-442)
  description: "how-to-configure-ipv6-automatic-6to4-tunneling (post 1239): R1 Gi0/0 - Gi0/0 R2 Gi0/1 - Gi0/0 R3, lesson config with Gi0/0 for Fa0/0 and Gi0/1 for Fa1/0. IOSv 15.9."
  version: 0.2.2
nodes:
  - id: n0
    label: R1
    node_definition: iosv
    x: 0
    y: 0
    configuration: |-
      hostname R1
      no ip domain lookup
      ipv6 unicast-routing
      interface Loopback0
       ipv6 address 2001::1/128
      interface GigabitEthernet0/0
       ip address 192.168.12.1 255.255.255.0
       no shutdown
      interface Tunnel0
       ipv6 address 2002:C0A8:C01::1/64
       tunnel source GigabitEthernet0/0
       tunnel mode ipv6ip 6to4
      router eigrp 123
       no auto-summary
       network 192.168.12.0
      ipv6 general-prefix MYPREFIX 6to4 GigabitEthernet0/0
      ipv6 route 2001::3/128 2002:C0A8:1703::3
      ipv6 route 2002::/16 Tunnel0
      line con 0
       exec-timeout 0 0
       logging synchronous
      end
    interfaces:
      - id: i0
        label: GigabitEthernet0/0
        slot: 0
        type: physical
  - id: n1
    label: R2
    node_definition: iosv
    x: 200
    y: 0
    configuration: |-
      hostname R2
      no ip domain lookup
      interface GigabitEthernet0/0
       ip address 192.168.12.2 255.255.255.0
       no shutdown
      interface GigabitEthernet0/1
       ip address 192.168.23.2 255.255.255.0
       no shutdown
      router eigrp 123
       no auto-summary
       network 192.168.12.0
       network 192.168.23.0
      line con 0
       exec-timeout 0 0
       logging synchronous
      end
    interfaces:
      - id: i0
        label: GigabitEthernet0/0
        slot: 0
        type: physical
      - id: i1
        label: GigabitEthernet0/1
        slot: 1
        type: physical
  - id: n2
    label: R3
    node_definition: iosv
    x: 400
    y: 0
    configuration: |-
      hostname R3
      no ip domain lookup
      ipv6 unicast-routing
      interface Loopback0
       ipv6 address 2001::3/128
      interface GigabitEthernet0/0
       ip address 192.168.23.3 255.255.255.0
       no shutdown
      interface Tunnel0
       ipv6 address 2002:C0A8:1703::3/64
       tunnel source GigabitEthernet0/0
       tunnel mode ipv6ip 6to4
      router eigrp 123
       no auto-summary
       network 192.168.23.0
      ipv6 general-prefix MYPREFIX 6to4 GigabitEthernet0/0
      ipv6 route 2001::1/128 2002:C0A8:C01::1
      ipv6 route 2002::/16 Tunnel0
      line con 0
       exec-timeout 0 0
       logging synchronous
      end
    interfaces:
      - id: i0
        label: GigabitEthernet0/0
        slot: 0
        type: physical
links:
  - id: l0
    i1: i0
    n1: n0
    i2: i0
    n2: n1
  - id: l1
    i1: i1
    n1: n1
    i2: i0
    n2: n2

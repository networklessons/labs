lab:
  title: ISATAP client (final, lab-470)
  description: 'ipv6-isatap (post 55267) final: R1-R2-R3 IOSv 15.9(3)M9. R3 ISATAP headend Tunnel0 (RA on), R1 ISATAP tunnel with static eui-64 address + static default route to FE80::5EFE:C0A8:1703.'
  version: 0.2.2
  notes: ''
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 0
  y: 0
  configuration:
  - name: ios_config.txt
    content: "hostname R1\nno ip domain lookup\nip cef\n!\ninterface Tunnel0\n no ip address\n no ip redirects\n ipv6 address 2001:DB8:13:13::/64 eui-64\n tunnel source GigabitEthernet0/0\n tunnel mode\
      \ ipv6ip isatap\n!\ninterface GigabitEthernet0/0\n ip address 192.168.12.1 255.255.255.0\n no shutdown\n!\nrouter ospf 1\n router-id 1.1.1.1\n network 192.168.12.0 0.0.0.255 area 0\n!\nipv6 route\
      \ ::/0 Tunnel0 FE80::5EFE:C0A8:1703\n!\nline con 0\n exec-timeout 0 0\n logging synchronous\n!\nend\n"
  interfaces:
  - id: i0
    label: GigabitEthernet0/0
    slot: 0
    type: physical
- id: n1
  label: R2
  node_definition: iosv
  x: 150
  y: 0
  configuration:
  - name: ios_config.txt
    content: "hostname R2\nno ip domain lookup\nip cef\n!\ninterface GigabitEthernet0/0\n ip address 192.168.12.2 255.255.255.0\n no shutdown\n!\ninterface GigabitEthernet0/1\n ip address 192.168.23.2 255.255.255.0\n\
      \ no shutdown\n!\nrouter ospf 1\n router-id 2.2.2.2\n network 192.168.12.0 0.0.0.255 area 0\n network 192.168.23.0 0.0.0.255 area 0\n!\nline con 0\n exec-timeout 0 0\n logging synchronous\n!\nend\n"
  interfaces:
  - id: i0
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i1
    label: GigabitEthernet0/1
    slot: 1
    type: physical
- id: n2
  label: R3
  node_definition: iosv
  x: 300
  y: 0
  configuration:
  - name: ios_config.txt
    content: "hostname R3\nno ip domain lookup\nip cef\n!\nipv6 unicast-routing\n!\ninterface Loopback0\n ipv6 address 2001:DB8:3:3::3/128\n!\ninterface Tunnel0\n no ip address\n no ip redirects\n ipv6\
      \ address 2001:DB8:13:13::/64 eui-64\n no ipv6 nd ra suppress\n tunnel source GigabitEthernet0/0\n tunnel mode ipv6ip isatap\n!\ninterface GigabitEthernet0/0\n ip address 192.168.23.3 255.255.255.0\n\
      \ no shutdown\n!\nrouter ospf 1\n router-id 3.3.3.3\n network 192.168.23.0 0.0.0.255 area 0\n!\nline con 0\n exec-timeout 0 0\n logging synchronous\n!\nend\n"
  interfaces:
  - id: i0
    label: GigabitEthernet0/0
    slot: 0
    type: physical
links:
- id: l0
  n1: n0
  i1: i0
  n2: n1
  i2: i0
- id: l1
  n1: n1
  i1: i1

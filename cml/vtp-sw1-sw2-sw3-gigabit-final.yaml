lab:
  description: 'Introduction to VTP: final configuration (SW1, SW2, SW3 IOSvL2 triangle)'
  notes: |-
    Lesson: https://networklessons.com/switching/introduction-to-vtp-vlan-trunking-protocol

    Links (all dot1q trunks):
    - SW1 Gi0/0 - SW2 Gi0/0
    - SW1 Gi0/1 - SW3 Gi0/0
    - SW2 Gi0/1 - SW3 Gi0/1

    Final state of the lesson (IOSvL2, VTP version 1, domain NETWORKLESSONS):
    - SW1: VTP server with VLANs 10, 20, 30, 40 and 50.
    - SW2: VTP transparent, with local VLANs 10, 20, 30, 40 and 60.
    - SW3: VTP server, learns VLANs 10, 20, 30, 40 and 50 through SW2.

    The lesson disconnects the SW1-SW3 link. Here SW1 Gi0/1 and SW3 Gi0/0 are shut down instead, so the lab boots in that state.

    VTP server mode doesn't store VLANs in the configuration, so the revision number after boot is 1 instead of the lesson's 5.
  title: Introduction to VTP
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1

lab:
  title: DMVPN phase 3 no ip redirects test (lab-367)
  description: 'dmvpn-phase-3-basic-configuration (post 19270): Hub, Spoke1, Spoke2
    IOSv on 192.168.123.0/24 via SW1, tunnel 172.16.123.0/24. Does no ip redirects
    get added automatically? Tunnels as in the lesson steps (no ''no ip redirects''
    typed: IOSv 15.9(3)M9 adds it with ''tunnel mode gre multipoint''); static routes
    between loopbacks via the hub to test redirect/shortcut.'
  notes: ''
  version: 0.2.2
nodes:
- id: n0
  label: Hub
  node_definition: iosv
  x: 0
  y: 0
  configuration: "hostname Hub\n!\nno ip domain lookup\n!\ninterface Loopback0\n ip\
    \ address 1.1.1.1 255.255.255.255\n!\ninterface GigabitEthernet0/1\n ip address\
    \ 192.168.123.1 255.255.255.0\n no cdp enable\n no shutdown\n!\ninterface Tunnel0\n\
    \ ip address 172.16.123.1 255.255.255.0\n ip nhrp authentication DMVPN\n ip nhrp\
    \ map multicast dynamic\n ip nhrp network-id 1\n ip nhrp redirect\n tunnel source\
    \ GigabitEthernet0/1\n tunnel mode gre multipoint\n!\nip route 2.2.2.2 255.255.255.255\
    \ 172.16.123.2\nip route 3.3.3.3 255.255.255.255 172.16.123.3\n!\nline con 0\n\
    \ exec-timeout 0 0\n logging synchronous\n!\nend\n"
  interfaces:
  - id: n0i0
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: n0i1
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: n0i2
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: n0i3
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: Spoke1
  node_definition: iosv
  x: -200
  y: 200
  configuration: "hostname Spoke1\n!\nno ip domain lookup\n!\ninterface Loopback0\n\
    \ ip address 2.2.2.2 255.255.255.255\n!\ninterface GigabitEthernet0/1\n ip address\
    \ 192.168.123.2 255.255.255.0\n no cdp enable\n no shutdown\n!\ninterface Tunnel0\n\
    \ ip address 172.16.123.2 255.255.255.0\n ip nhrp authentication DMVPN\n ip nhrp\
    \ map 172.16.123.1 192.168.123.1\n ip nhrp map multicast 192.168.123.1\n ip nhrp\
    \ network-id 1\n ip nhrp nhs 172.16.123.1\n ip nhrp shortcut\n tunnel source GigabitEthernet0/1\n\
    \ tunnel mode gre multipoint\n!\nip route 3.3.3.3 255.255.255.255 172.16.123.1\n\
    !\nline con 0\n exec-timeout 0 0\n logging synchronous\n!\nend\n"
  interfaces:
  - id: n1i0
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: n1i1
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: n1i2
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: n1i3
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n2
  label: Spoke2
  node_definition: iosv
  x: 200
  y: 200
  configuration: "hostname Spoke2\n!\nno ip domain lookup\n!\ninterface Loopback0\n\
    \ ip address 3.3.3.3 255.255.255.255\n!\ninterface GigabitEthernet0/1\n ip address\
    \ 192.168.123.3 255.255.255.0\n no cdp enable\n no shutdown\n!\ninterface Tunnel0\n\
    \ ip address 172.16.123.3 255.255.255.0\n ip nhrp authentication DMVPN\n ip nhrp\
    \ map 172.16.123.1 192.168.123.1\n ip nhrp map multicast 192.168.123.1\n ip nhrp\
    \ network-id 1\n ip nhrp nhs 172.16.123.1\n ip nhrp shortcut\n tunnel source GigabitEthernet0/1\n\
    \ tunnel mode gre multipoint\n!\nip route 2.2.2.2 255.255.255.255 172.16.123.1\n\
    !\nline con 0\n exec-timeout 0 0\n logging synchronous\n!\nend\n"
  interfaces:
  - id: n2i0
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: n2i1
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: n2i2
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: n2i3
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n3
  label: SW1
  node_definition: unmanaged_switch
  x: 0
  y: 100
  configuration: ''
  interfaces:
  - id: n3i0
    label: port0
    slot: 0
    type: physical
  - id: n3i1
    label: port1
    slot: 1
    type: physical
  - id: n3i2
    label: port2
    slot: 2
    type: physical
  - id: n3i3
    label: port3
    slot: 3
    type: physical
links:
- id: l0
  n1: n0
  i1: n0i1
  n2: n3
  i2: n3i0
  label: Hub-Gi0/1<->SW1-port0
- id: l1
  n1: n1
  i1: n1i1
  n2: n3
  i2: n3i1
  label: Spoke1-Gi0/1<->SW1-port1
- id: l2
  n1: n2
  i1: n2i1
  n2: n3
  i2: n3i2
  label: Spoke2-Gi0/1<->SW1-port2
annotations: []

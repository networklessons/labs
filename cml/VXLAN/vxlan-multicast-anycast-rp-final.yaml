lab:
  title: lab-483 vxlan-multicast-anycast-rp debug ip pim data-register
  description: 'Fact-check lab-483 (post 70806): does NX-OS accept debug ip pim data-register
    without send/receive, and what does each variant show? PC1-LEAF1 (IOL XE DR) -
    SPINE1 - SPINE2 (NX-OS 9000v 10.6(2), anycast RP 12.12.12.12).'
  notes: 'Anycast-RP state (both spines RP 12.12.12.12). Receive/send debugs on SPINE1/SPINE2;
    PC1 pings 239.1.1.1. Send-on-DR test: remove anycast-rp + loopback1 on SPINE1,
    anycast-rp on SPINE2, no ip multicast-routing + no ip pim on LEAF1 Et0/1, SPINE1
    Eth1/1 ip pim dr-priority 100, LEAF1 ping 239.1.1.1 source Et0/1. IOL configs
    given as plain strings (named iosxe_config.txt they were dropped on import).'
  version: 0.2.2
nodes:
- id: n0
  label: PC1
  node_definition: iol-xe
  x: -400
  y: 0
  configuration: "hostname PC1\nno ip routing\nno ip domain lookup\ninterface Ethernet0/0\n\
    \ ip address 10.1.1.10 255.255.255.0\n no shutdown\nip default-gateway 10.1.1.1\n\
    line con 0\n exec-timeout 0 0\nend\n"
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: i2
    label: Ethernet0/1
    slot: 1
    type: physical
  - id: i3
    label: Ethernet0/2
    slot: 2
    type: physical
  - id: i4
    label: Ethernet0/3
    slot: 3
    type: physical
- id: n1
  label: LEAF1
  node_definition: iol-xe
  x: -200
  y: 0
  configuration: "hostname LEAF1\nno ip domain lookup\nip multicast-routing\nip pim\
    \ rp-address 12.12.12.12\ninterface Ethernet0/0\n ip address 10.1.1.1 255.255.255.0\n\
    \ ip pim sparse-mode\n ip ospf 1 area 0\n no shutdown\ninterface Ethernet0/1\n\
    \ ip address 192.168.13.3 255.255.255.0\n ip pim sparse-mode\n ip ospf network\
    \ point-to-point\n ip ospf 1 area 0\n no shutdown\nrouter ospf 1\n router-id 3.3.3.3\n\
    line con 0\n exec-timeout 0 0\n logging synchronous\nend\n"
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: Ethernet0/0
    slot: 0
    type: physical
  - id: i2
    label: Ethernet0/1
    slot: 1
    type: physical
  - id: i3
    label: Ethernet0/2
    slot: 2
    type: physical
  - id: i4
    label: Ethernet0/3
    slot: 3
    type: physical
- id: n2
  label: SPINE1
  node_definition: nxosv9000
  x: 0
  y: 0
  configuration:
  - name: nxos_config.txt
    content: "hostname SPINE1\n# workaround for booting to loader> prompt\necho 'from\
      \ cli import cli' > set_boot.py\necho 'import json' >> set_boot.py\necho 'import\
      \ os' >> set_boot.py\necho 'import time' >> set_boot.py\necho 'bootimage = json.loads(cli(\"\
      show version | json\"))[\"nxos_file_name\"]' >> set_boot.py\necho 'set_boot\
      \ = cli(\"conf t ; boot nxos {} ; no event manager applet BOOTCONFIG\".format(bootimage))'\
      \ >> set_boot.py\necho 'i = 0' >> set_boot.py\necho 'while i < 10:' >> set_boot.py\n\
      echo '    try:' >> set_boot.py\necho '        save_config = cli(\"copy running-config\
      \ startup-config\")' >> set_boot.py\necho '        break' >> set_boot.py\necho\
      \ '    except Exception:' >> set_boot.py\necho '        i += 1' >> set_boot.py\n\
      echo '        time.sleep(1)' >> set_boot.py\necho 'os.remove(\"/bootflash/set_boot.py\"\
      )' >> set_boot.py\nevent manager applet BOOTCONFIG\n event syslog pattern \"\
      Configured from vty\"\n action 1.0 cli python bootflash:set_boot.py\nno password\
      \ strength-check\nusername admin role network-admin\nusername admin password\
      \ cisco role network-admin\nusername cisco role network-admin\nusername cisco\
      \ password cisco role network-admin\nfeature ospf\nfeature pim\n\nip pim rp-address\
      \ 12.12.12.12 group-list 224.0.0.0/4\nip pim anycast-rp 12.12.12.12 1.1.1.1\n\
      ip pim anycast-rp 12.12.12.12 2.2.2.2\n\nrouter ospf 1\n  router-id 1.1.1.1\n\
      \ninterface Ethernet1/1\n  no switchport\n  mac-address 0050.c253.1001\n  ip\
      \ address 192.168.13.1/24\n  ip ospf network point-to-point\n  ip router ospf\
      \ 1 area 0.0.0.0\n  ip pim sparse-mode\n  no shutdown\n\ninterface Ethernet1/2\n\
      \  no switchport\n  mac-address 0050.c253.1002\n  ip address 192.168.12.1/24\n\
      \  ip ospf network point-to-point\n  ip router ospf 1 area 0.0.0.0\n  ip pim\
      \ sparse-mode\n  no shutdown\n\ninterface loopback0\n  ip address 1.1.1.1/32\n\
      \  ip router ospf 1 area 0.0.0.0\n  ip pim sparse-mode\n\ninterface loopback1\n\
      \  ip address 12.12.12.12/32\n  ip router ospf 1 area 0.0.0.0\n  ip pim sparse-mode\n\
      \n"
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: mgmt0
    slot: 0
    type: physical
  - id: i2
    label: Ethernet1/1
    slot: 1
    type: physical
  - id: i3
    label: Ethernet1/2
    slot: 2
    type: physical
- id: n3
  label: SPINE2
  node_definition: nxosv9000
  x: 200
  y: 0
  configuration:
  - name: nxos_config.txt
    content: "hostname SPINE2\n# workaround for booting to loader> prompt\necho 'from\
      \ cli import cli' > set_boot.py\necho 'import json' >> set_boot.py\necho 'import\
      \ os' >> set_boot.py\necho 'import time' >> set_boot.py\necho 'bootimage = json.loads(cli(\"\
      show version | json\"))[\"nxos_file_name\"]' >> set_boot.py\necho 'set_boot\
      \ = cli(\"conf t ; boot nxos {} ; no event manager applet BOOTCONFIG\".format(bootimage))'\
      \ >> set_boot.py\necho 'i = 0' >> set_boot.py\necho 'while i < 10:' >> set_boot.py\n\
      echo '    try:' >> set_boot.py\necho '        save_config = cli(\"copy running-config\
      \ startup-config\")' >> set_boot.py\necho '        break' >> set_boot.py\necho\
      \ '    except Exception:' >> set_boot.py\necho '        i += 1' >> set_boot.py\n\
      echo '        time.sleep(1)' >> set_boot.py\necho 'os.remove(\"/bootflash/set_boot.py\"\
      )' >> set_boot.py\nevent manager applet BOOTCONFIG\n event syslog pattern \"\
      Configured from vty\"\n action 1.0 cli python bootflash:set_boot.py\nno password\
      \ strength-check\nusername admin role network-admin\nusername admin password\
      \ cisco role network-admin\nusername cisco role network-admin\nusername cisco\
      \ password cisco role network-admin\nfeature ospf\nfeature pim\n\nip pim rp-address\
      \ 12.12.12.12 group-list 224.0.0.0/4\nip pim anycast-rp 12.12.12.12 1.1.1.1\n\
      ip pim anycast-rp 12.12.12.12 2.2.2.2\n\nrouter ospf 1\n  router-id 2.2.2.2\n\
      \ninterface Ethernet1/1\n  no switchport\n  mac-address 0050.c253.2001\n  ip\
      \ address 192.168.12.2/24\n  ip ospf network point-to-point\n  ip router ospf\
      \ 1 area 0.0.0.0\n  ip pim sparse-mode\n  no shutdown\n\ninterface loopback0\n\
      \  ip address 2.2.2.2/32\n  ip router ospf 1 area 0.0.0.0\n  ip pim sparse-mode\n\
      \ninterface loopback1\n  ip address 12.12.12.12/32\n  ip router ospf 1 area\
      \ 0.0.0.0\n  ip pim sparse-mode\n\n"
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: mgmt0
    slot: 0
    type: physical
  - id: i2
    label: Ethernet1/1
    slot: 1
    type: physical
links:
- id: l0
  n1: n0
  i1: i1
  n2: n1
  i2: i1
  label: pc-leaf
- id: l1
  n1: n1
  i1: i2
  n2: n2
  i2: i2
  label: leaf-spine1
- id: l2
  n1: n2
  i1: i3
  n2: n3
  i2: i2
  label: spine1-spine2
annotations: []

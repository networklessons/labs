lab:
  title: lab-475 vxlan-underlay-ebgp-two-as nexthop route-map test
  description: 'Fact-check lab-475 (post 79734): is nexthop route-map needed under
    l2vpn evpn on eBGP spines, or only the per-neighbor route-map out? SPINE1/2 AS1,
    LEAF1/2 AS2, NX-OS 9000v; S1/S2 IOSv hosts in VLAN 10/VNI 10010. Final state =
    proposed lesson config (no nexthop route-map; per-neighbor route-map NEXT_HOP_UNCHANGED
    out on the spines). NX-OS 9000v 10.6(2), IOSv 15.9 hosts.'
  notes: ''
  version: 0.2.2
nodes:
- id: n0
  label: SPINE1
  node_definition: nxosv9000
  x: -200
  y: -200
  configuration:
  - name: nxos_config.txt
    content: "hostname SPINE1\n# workaround for booting to loader> prompt\necho 'from\
      \ cli import cli' > set_boot.py\necho 'import json' >> set_boot.py\necho 'import\
      \ os' >> set_boot.py\necho 'import time' >> set_boot.py\necho 'bootimage = json.loads(cli(\"\
      show version | json\"))[\"nxos_file_name\"]' >> set_boot.py\necho 'set_boot\
      \ = cli(\"conf t ; boot nxos {} ; no event manager applet BOOTCONFIG\".format(bootimage))'\
      \ >> set_boot.py\necho 'i = 0' >> set_boot.py\necho 'while i < 10:' >> set_boot.py\n\
      echo '    try:' >> set_boot.py\necho '        save_config = cli(\"copy running-config\
      \ startup-config\")' >> set_boot.py\necho '        break' >> set_boot.py\necho\
      \ '    except Exception:' >> set_boot.py\necho '        i += 1' >> set_boot.py\n\
      echo '        time.sleep(1)' >> set_boot.py\necho 'os.remove(\"/bootflash/set_boot.py\"\
      )' >> set_boot.py\nevent manager applet BOOTCONFIG\n event syslog pattern \"\
      Configured from vty\"\n action 1.0 cli python bootflash:set_boot.py\nno password\
      \ strength-check\nusername admin role network-admin\nusername admin password\
      \ cisco role network-admin\nusername cisco role network-admin\nusername cisco\
      \ password cisco role network-admin\nfeature bgp\nfeature pim\n\nnv overlay\
      \ evpn\n\nip pim rp-address 1.1.1.1 group-list 224.0.0.0/4\n\nvlan 1\n\nroute-map\
      \ NEXT_HOP_UNCHANGED permit 10\n  set ip next-hop unchanged\n\ninterface Ethernet1/1\n\
      \  no switchport\n  mtu 9216\n  mac-address 0050.c253.1001\n  ip address 192.168.13.1/24\n\
      \  ip pim sparse-mode\n  no shutdown\n\ninterface Ethernet1/2\n  no switchport\n\
      \  mtu 9216\n  mac-address 0050.c253.1002\n  ip address 192.168.14.1/24\n  ip\
      \ pim sparse-mode\n  no shutdown\n\ninterface Ethernet1/3\n  no switchport\n\
      \  mtu 9216\n  mac-address 0050.c253.1003\n  ip address 192.168.15.1/24\n  ip\
      \ pim sparse-mode\n  no shutdown\n\ninterface Ethernet1/4\n  no switchport\n\
      \  mtu 9216\n  mac-address 0050.c253.1004\n  ip address 192.168.16.1/24\n  ip\
      \ pim sparse-mode\n  no shutdown\n  \ninterface loopback0\n  ip address 1.1.1.1/32\n\
      \  ip pim sparse-mode\n  \nrouter bgp 1\n  router-id 1.1.1.1\n  address-family\
      \ ipv4 unicast\n    network 1.1.1.1/32\n  address-family l2vpn evpn\n    retain\
      \ route-target all\n  neighbor 3.3.3.3\n    remote-as 2\n    update-source loopback0\n\
      \    ebgp-multihop 2\n    address-family l2vpn evpn\n      disable-peer-as-check\n\
      \      send-community\n      send-community extended\n      route-map NEXT_HOP_UNCHANGED\
      \ out\n  neighbor 4.4.4.4\n    remote-as 2\n    update-source loopback0\n  \
      \  ebgp-multihop 2\n    address-family l2vpn evpn\n      disable-peer-as-check\n\
      \      send-community\n      send-community extended\n      route-map NEXT_HOP_UNCHANGED\
      \ out\n  neighbor 5.5.5.5\n    remote-as 2\n    update-source loopback0\n  \
      \  ebgp-multihop 2\n    address-family l2vpn evpn\n      disable-peer-as-check\n\
      \      send-community\n      send-community extended\n      route-map NEXT_HOP_UNCHANGED\
      \ out\n  neighbor 6.6.6.6\n    remote-as 2\n    update-source loopback0\n  \
      \  ebgp-multihop 2\n    address-family l2vpn evpn\n      disable-peer-as-check\n\
      \      send-community\n      send-community extended\n      route-map NEXT_HOP_UNCHANGED\
      \ out\n  neighbor 192.168.13.3\n    remote-as 2\n    address-family ipv4 unicast\n\
      \      disable-peer-as-check\n  neighbor 192.168.14.4\n    remote-as 2\n   \
      \ address-family ipv4 unicast\n      disable-peer-as-check\n  neighbor 192.168.15.5\n\
      \    remote-as 2\n    address-family ipv4 unicast\n      disable-peer-as-check\n\
      \  neighbor 192.168.16.6\n    remote-as 2\n    address-family ipv4 unicast\n\
      \      disable-peer-as-check\n"

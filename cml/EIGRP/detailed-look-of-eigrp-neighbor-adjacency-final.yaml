annotations: []
smart_annotations: []
nodes:
  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |-
          hostname R1
          no ip domain lookup
          no service timestamps debug
          no service timestamps log
          logging discriminator NOCFG mnemonics drops CONFIG_I
          logging buffered discriminator NOCFG 512000 debugging
          no logging console
          interface Loopback0
           ip address 1.1.1.1 255.255.255.0
          interface GigabitEthernet0/0
           ip address 192.168.12.1 255.255.255.0
           no shutdown
          router eigrp 1
           no auto-summary
           network 1.1.1.0 0.0.0.255
           network 192.168.12.0
          line con 0
           exec-timeout 0 0
          end
    id: n0
    label: R1
    node_definition: iosv
    x: 0
    y: 0
    interfaces:
      - id: i0
        label: Loopback0
        type: loopback
      - id: i1
        label: GigabitEthernet0/0
        type: physical
        slot: 0
  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |-
          hostname R2
          no ip domain lookup
          no service timestamps debug
          no service timestamps log
          logging discriminator NOCFG mnemonics drops CONFIG_I
          logging buffered discriminator NOCFG 512000 debugging
          no logging console
          interface Loopback0
           ip address 2.2.2.2 255.255.255.0
          interface GigabitEthernet0/0
           ip address 192.168.12.2 255.255.255.0
           no shutdown
          router eigrp 1
           no auto-summary
           network 2.2.2.0 0.0.0.255
           network 192.168.12.0
           passive-interface default
           no passive-interface GigabitEthernet0/0
          line con 0
           exec-timeout 0 0
          end
    id: n1
    label: R2
    node_definition: iosv
    x: 200
    y: 0
    interfaces:
      - id: i0
        label: Loopback0
        type: loopback
      - id: i1
        label: GigabitEthernet0/0
        type: physical
        slot: 0
links:
  - id: l0
    n1: n0
    n2: n1
    i1: i1
    i2: i1
    label: R1-GigabitEthernet0/0<->R2-GigabitEthernet0/0
lab:
  description: 'detailed-look-of-eigrp-neighbor-adjacency (post 1031) re-capture, final state: R1-R2 IOSv 15.9 Gi0/0 192.168.12.0/24, Lo0 1.1.1.1/24 and 2.2.2.2/24, EIGRP AS 1.'
  notes: ''
  title: EIGRP neighbor adjacency re-capture (rc-360)
  version: 0.3.1

lab:
  description: 'eigrp-wide-metrics (post 53505): classic vs named mode metrics at
    1G/10G/20G+/100G via bandwidth; hidden metric version 32bit. R1-R2 IOSv 15.9,
    R3-R4 IOL XE. 3 parallel links per pair.'
  notes: 'Startup configs without the EEM applets used for capture (console CLI was
    down). Lo1-Lo6 = 1G/10G/11G/20G/40G/100G with delay 1; IOSv rejects bandwidth
    above 10000000. Test step: add ''metric version 32bit'' under the NAMED address-family
    on R1/R3.'
  title: EIGRP wide metrics test (lab-334)
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1

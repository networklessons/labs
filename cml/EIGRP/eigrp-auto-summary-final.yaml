lab:
  title: EIGRP auto-summary learned routes test (lab-378)
  description: 'eigrp-auto-summary (post 7773): R1-R2-R3 IOSv, lesson addressing,
    auto-summary on R2 only. Does R2 hide learned 1.1.1.0/24 behind 1.0.0.0/8 once
    it has its own 1.2.2.0/24? Final state: R2 has Loopback0 1.2.2.1/24 in EIGRP,
    so R3 only gets 1.0.0.0/8. Remove ''network 1.2.2.0 0.0.0.255'' on R2 to get the
    lesson''s third scenario (R3 gets 1.1.1.0/24).'
  notes: ''
  version: 0.2.2
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 0
  y: 0
  configuration: "hostname R1\n!\nno ip domain lookup\n!\ninterface Loopback0\n ip\
    \ address 1.1.1.1 255.255.255.0\n!\ninterface Loopback1\n ip address 172.16.1.1\
    \ 255.255.255.0\n!\ninterface GigabitEthernet0/1\n ip address 192.168.12.1 255.255.255.0\n\
    \ no shutdown\n!\nrouter eigrp 1\n network 1.1.1.0 0.0.0.255\n network 192.168.12.0\n\
    !\nline con 0\n exec-timeout 0 0\n logging synchronous\n!\nend\n"
  interfaces:
  - id: n0i0
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: n0i1
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: n0i2
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: n0i3
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n1
  label: R2
  node_definition: iosv
  x: 200
  y: 0
  configuration: "hostname R2\n!\nno ip domain lookup\n!\ninterface Loopback0\n ip\
    \ address 1.2.2.1 255.255.255.0\n!\ninterface GigabitEthernet0/1\n ip address\
    \ 192.168.12.2 255.255.255.0\n no shutdown\n!\ninterface GigabitEthernet0/2\n\
    \ ip address 192.168.23.2 255.255.255.0\n no shutdown\n!\nrouter eigrp 1\n network\
    \ 1.2.2.0 0.0.0.255\n network 192.168.12.0\n network 192.168.23.0\n auto-summary\n\
    !\nline con 0\n exec-timeout 0 0\n logging synchronous\n!\nend\n"
  interfaces:
  - id: n1i0
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: n1i1
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: n1i2
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: n1i3
    label: GigabitEthernet0/3
    slot: 3
    type: physical
- id: n2
  label: R3
  node_definition: iosv
  x: 400
  y: 0
  configuration: "hostname R3\n!\nno ip domain lookup\n!\ninterface Loopback0\n ip\
    \ address 1.3.3.1 255.255.255.0\n!\ninterface GigabitEthernet0/1\n ip address\
    \ 192.168.23.3 255.255.255.0\n no shutdown\n!\nrouter eigrp 1\n network 192.168.23.0\n\
    !\nline con 0\n exec-timeout 0 0\n logging synchronous\n!\nend\n"
  interfaces:
  - id: n2i0
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: n2i1
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: n2i2
    label: GigabitEthernet0/2
    slot: 2
    type: physical
  - id: n2i3
    label: GigabitEthernet0/3
    slot: 3
    type: physical
links:
- id: l0
  n1: n0
  i1: n0i1
  n2: n1
  i2: n1i1
  label: R1-Gi0/1<->R2-Gi0/1
- id: l1
  n1: n1
  i1: n1i2
  n2: n2
  i2: n2i1
  label: R2-Gi0/2<->R3-Gi0/1
annotations: []

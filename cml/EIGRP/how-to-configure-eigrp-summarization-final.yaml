lab:
  title: EIGRP summarization summary-metric (lab-441)
  description: 'how-to-configure-eigrp-summarization (post 842): R1 Gi0/1 172.16.0.1/24
    (SW1), Gi0/2 172.16.1.1/24 (SW2), Gi0/0 192.168.12.1 to R2 Gi0/0 .2. Classic router
    eigrp 1 with summary-metric. IOSv 15.9. Startup configs = lesson final state.'
  version: 0.2.2
nodes:
- id: n0
  label: R1
  node_definition: iosv
  x: 0
  y: 0
  configuration: |-
    hostname R1
    no ip domain lookup
    interface GigabitEthernet0/0
     ip address 192.168.12.1 255.255.255.0
     ip summary-address eigrp 1 172.16.0.0 255.255.254.0
     no shutdown
    interface GigabitEthernet0/1
     ip address 172.16.0.1 255.255.255.0
     no shutdown
    interface GigabitEthernet0/2
     ip address 172.16.1.1 255.255.255.0
     no shutdown
    router eigrp 1
     summary-metric 172.16.0.0/23 100000 10 255 0 1500
     network 172.16.0.0
     network 192.168.12.0
    line con 0
     exec-timeout 0 0
     logging synchronous
    end
  interfaces:
  - id: i0
    label: GigabitEthernet0/0
    slot: 0
    type: physical
  - id: i1
    label: GigabitEthernet0/1
    slot: 1
    type: physical
  - id: i2
    label: GigabitEthernet0/2
    slot: 2
    type: physical
- id: n1
  label: R2
  node_definition: iosv
  x: 300
  y: 0
  configuration: |-
    hostname R2
    no ip domain lookup
    interface GigabitEthernet0/0
     ip address 192.168.12.2 255.255.255.0
     no shutdown
    router eigrp 1
     network 192.168.12.0
    line con 0
     exec-timeout 0 0
     logging synchronous
    end
  interfaces:
  - id: i0
    label: GigabitEthernet0/0
    slot: 0
    type: physical
- id: n2
  label: SW1
  node_definition: unmanaged_switch
  x: 0
  y: -150
  interfaces:
  - id: i0
    label: port0
    slot: 0
    type: physical
- id: n3
  label: SW2
  node_definition: unmanaged_switch
  x: 0
  y: 150
  interfaces:
  - id: i0
    label: port0
    slot: 0
    type: physical
links:
- id: l0
  n1: n0
  n2: n1
  i1: i0
  i2: i0
- id: l1
  n1: n0
  n2: n2
  i1: i1
  i2: i0
- id: l2
  n1: n0
  n2: n3
  i1: i2
  i2: i0

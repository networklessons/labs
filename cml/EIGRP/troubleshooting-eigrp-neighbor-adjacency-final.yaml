lab:
  description: 'troubleshooting-eigrp-neighbor-adjacency (post 7019) full re-capture, R1-R2 IOSv 15.9(3)M9 Gi0/0. Startup = base only; scenarios configured from the CLI in order: 1 uncommon subnet (R1 192.168.12.1/24, R2 192.168.21.2/24, EIGRP 12; fix R2 to 192.168.12.2 + network 192.168.12.0); 2 K-values (R1 metric weights 0 1 1 1 1 0; fix same on R2; then no metric weights on both); 3 AS mismatch (R2 router eigrp 21; fix no router eigrp 21 + router eigrp 12); 4 passive (R2 passive-interface Gi0/0; fix no passive-interface); 5 multicast filter: see lab-421 first run (R2 ACL BLOCKMULTICAST inbound). Frame relay not possible on IOSv.'
  notes: ''
  title: EIGRP neighbor adjacency full re-capture (lab-421 v2)
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1


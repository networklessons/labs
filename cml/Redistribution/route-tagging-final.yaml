nodes:
  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |-
          hostname R1
          no ip domain lookup
          interface Ethernet0/0
           description to R3 (OSPF)
           ip address 192.168.13.1 255.255.255.0
           no shutdown
          interface Ethernet0/1
           description to R4 (RIP)
           ip address 192.168.14.1 255.255.255.0
           no shutdown
          route-map TAG deny 10
           match tag 1
          route-map TAG permit 20
           set tag 1
          router ospf 1
           router-id 11.11.11.11
           redistribute rip subnets route-map TAG
           network 192.168.13.0 0.0.0.255 area 0
          router rip
           version 2
           redistribute ospf 1 metric 5 route-map TAG
           network 192.168.14.0
           no auto-summary
          line con 0
           exec-timeout 0 0
           logging synchronous
          end
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false

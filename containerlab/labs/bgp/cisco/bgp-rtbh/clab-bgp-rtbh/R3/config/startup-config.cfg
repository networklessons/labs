hostname R3
!
interface Null0
 no ip unreachables
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
!
interface GigabitEthernet2
 description >> To core segment (iBGP to both borders)
 ip address 192.168.234.3 255.255.255.0
 no shutdown
!
router bgp 234
 bgp router-id 3.3.3.3
 bgp log-neighbor-changes
 redistribute static route-map RTBH-TRIGGER
 neighbor 192.168.234.2 remote-as 234
 neighbor 192.168.234.2 send-community
 neighbor 192.168.234.4 remote-as 234
 neighbor 192.168.234.4 send-community
!
ip bgp-community new-format
!
route-map RTBH-TRIGGER permit 10
 description Tag 777 statics become blackhole announcements
 match tag 777
 set community 1234:4321 no-export
!
end

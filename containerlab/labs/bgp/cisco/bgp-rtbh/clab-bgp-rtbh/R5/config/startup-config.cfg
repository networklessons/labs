hostname R5
!
interface Loopback0
 description >> VICTIM - DDoS target
 ip address 5.5.5.5 255.255.255.255
!
interface Loopback1
 description >> BYSTANDER - must stay reachable
 ip address 5.5.55.55 255.255.255.255
!
interface GigabitEthernet2
 description >> To R2 (eBGP)
 ip address 192.168.25.5 255.255.255.0
 no shutdown
!
interface GigabitEthernet3
 description >> To R4 (eBGP)
 ip address 192.168.45.5 255.255.255.0
 no shutdown
!
router bgp 5
 bgp router-id 5.5.5.5
 bgp log-neighbor-changes
 network 5.5.0.0 mask 255.255.0.0
 neighbor 192.168.25.2 remote-as 234
 neighbor 192.168.45.4 remote-as 234
!
ip bgp-community new-format
ip route 5.5.0.0 255.255.0.0 Null0
!
end

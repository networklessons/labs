hostname R2
!
interface Null0
 no ip unreachables
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
!
interface GigabitEthernet2
 description >> To R1 (eBGP, Internet-facing)
 ip address 192.168.12.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet3
 description >> To core segment (iBGP)
 ip address 192.168.234.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet4
 description >> To R5 (eBGP, customer-facing)
 ip address 192.168.25.2 255.255.255.0
 no shutdown
!
router bgp 234
 bgp router-id 2.2.2.2
 bgp log-neighbor-changes
 neighbor 192.168.12.1 remote-as 1
 neighbor 192.168.25.5 remote-as 5
 neighbor 192.168.234.3 remote-as 234
 neighbor 192.168.234.3 next-hop-self
 neighbor 192.168.234.3 soft-reconfiguration inbound
 neighbor 192.168.234.3 route-map RTBH in
 neighbor 192.168.234.4 remote-as 234
 neighbor 192.168.234.4 next-hop-self
!
ip bgp-community new-format
ip community-list standard RTBH-COMMUNITY permit 1234:4321
ip route 192.0.2.1 255.255.255.255 Null0
!
ip prefix-list RTBH-OK seq 5 permit 5.5.0.0/16 ge 32
!
route-map RTBH permit 10
 description Valid blackhole -> discard next-hop
 match ip address prefix-list RTBH-OK
 match community RTBH-COMMUNITY
 set ip next-hop 192.0.2.1
!
route-map RTBH deny 20
 description Blackhole request outside customer space -> reject outright
 match community RTBH-COMMUNITY
!
route-map RTBH permit 30
 description All ordinary prefixes pass untouched
!
end

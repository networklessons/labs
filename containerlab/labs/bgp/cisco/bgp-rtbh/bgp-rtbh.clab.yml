# BGP Remotely Triggered Black Hole (RTBH).
# R1 (AS 1) is the Internet, eBGP to both borders R2 and R4 (AS 234).
# R3 (AS 234) is the trigger router, iBGP full mesh with R2 and R4 through SW1.
# R5 (AS 5) is the customer, multihomed to R2 and R4.

name: bgp-rtbh
mgmt:
  network: mgmt-ipv4
  ipv4-subnet: 10.65.97.0/24
topology:
  nodes:
    R1:
      kind: cisco_c8000v
      image: docker-registry.nwl.lab/cisco_c8000v:17.13.01a
      mgmt-ipv4: 10.65.97.11
      startup-config: ./clab-bgp-rtbh/R1/config/startup-config.cfg
    R2:
      kind: cisco_c8000v
      image: docker-registry.nwl.lab/cisco_c8000v:17.13.01a
      mgmt-ipv4: 10.65.97.12
      startup-config: ./clab-bgp-rtbh/R2/config/startup-config.cfg
    R3:
      kind: cisco_c8000v
      image: docker-registry.nwl.lab/cisco_c8000v:17.13.01a
      mgmt-ipv4: 10.65.97.13
      startup-config: ./clab-bgp-rtbh/R3/config/startup-config.cfg
    R4:
      kind: cisco_c8000v
      image: docker-registry.nwl.lab/cisco_c8000v:17.13.01a
      mgmt-ipv4: 10.65.97.14
      startup-config: ./clab-bgp-rtbh/R4/config/startup-config.cfg
    R5:
      kind: cisco_c8000v
      image: docker-registry.nwl.lab/cisco_c8000v:17.13.01a
      mgmt-ipv4: 10.65.97.15
      startup-config: ./clab-bgp-rtbh/R5/config/startup-config.cfg
    SW1:
      kind: cisco_iol
      image: docker-registry.nwl.lab/cisco_iol:l2-17.12.01
      type: l2
      mgmt-ipv4: 10.65.97.16
  links:
    - endpoints: ["R1:eth1", "R2:eth1"]
    - endpoints: ["R1:eth2", "R4:eth1"]
    - endpoints: ["R2:eth2", "SW1:Ethernet0/1"]
    - endpoints: ["R3:eth1", "SW1:Ethernet0/2"]
    - endpoints: ["R4:eth2", "SW1:Ethernet0/3"]
    - endpoints: ["R2:eth3", "R5:eth1"]
    - endpoints: ["R4:eth3", "R5:eth2"]

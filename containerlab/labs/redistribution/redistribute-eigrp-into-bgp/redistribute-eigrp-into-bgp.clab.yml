# Redistribute EIGRP into BGP.
# R1 and R2 run EIGRP through SW1.
# R2 and R3 run eBGP, R2 redistributes EIGRP into BGP.

name: redistribute-eigrp-into-bgp
mgmt:
  network: mgmt-ipv4
  ipv4-subnet: 10.65.97.0/24
topology:
  nodes:
    R1:
      kind: cisco_c8000v
      image: docker-registry.nwl.lab/cisco_c8000v:17.13.01a
      mgmt-ipv4: 10.65.97.11
      startup-config: ./clab-redistribute-eigrp-into-bgp/R1/config/startup-config.cfg
    R2:
      kind: cisco_c8000v
      image: docker-registry.nwl.lab/cisco_c8000v:17.13.01a
      mgmt-ipv4: 10.65.97.12
      startup-config: ./clab-redistribute-eigrp-into-bgp/R2/config/startup-config.cfg
    R3:
      kind: cisco_c8000v
      image: docker-registry.nwl.lab/cisco_c8000v:17.13.01a
      mgmt-ipv4: 10.65.97.13
      startup-config: ./clab-redistribute-eigrp-into-bgp/R3/config/startup-config.cfg
    SW1:
      kind: cisco_iol
      image: docker-registry.nwl.lab/cisco_iol:l2-17.12.01
      type: l2
      mgmt-ipv4: 10.65.97.14
  links:
    - endpoints: ["R1:eth1", "SW1:Ethernet0/1"]
    - endpoints: ["R2:eth1", "SW1:Ethernet0/2"]
    - endpoints: ["R2:eth2", "R3:eth1"]

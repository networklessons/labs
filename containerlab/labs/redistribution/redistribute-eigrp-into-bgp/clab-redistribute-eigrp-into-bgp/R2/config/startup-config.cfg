hostname R2
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
!
interface GigabitEthernet2
 ip address 192.168.12.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet3
 ip address 192.168.23.2 255.255.255.0
 no shutdown
!
router eigrp 1
 network 2.2.2.2 0.0.0.0
 network 192.168.12.0
!
router bgp 2
 redistribute eigrp 1 route-map RM-REDIST-ACL
 neighbor 192.168.23.3 remote-as 3
!
ip prefix-list PL-REDIST-EIGRP seq 5 permit 1.1.1.1/32
!
ip access-list standard 1
 10 permit 1.1.1.1
!
route-map RM-REDIST-EIGRP permit 10
 match ip address prefix-list PL-REDIST-EIGRP
!
route-map RM-REDIST-ACL permit 10
 match ip address 1
!
end

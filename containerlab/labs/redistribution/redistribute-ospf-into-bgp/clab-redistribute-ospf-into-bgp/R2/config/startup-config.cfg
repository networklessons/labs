hostname R2
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
!
interface GigabitEthernet2
 ip address 192.168.12.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet3
 ip address 192.168.23.2 255.255.255.0
 no shutdown
!
router ospf 1
 network 2.2.2.2 0.0.0.0 area 0
 network 192.168.12.0 0.0.0.255 area 0
!
router bgp 2
 redistribute ospf 1 route-map RM_OSPF_TO_BGP
 neighbor 192.168.23.3 remote-as 3
!
ip prefix-list PL_LOOPBACK seq 10 permit 1.1.1.1/32
ip prefix-list PL_LOOPBACK seq 20 deny 0.0.0.0/0 le 32
!
route-map RM_OSPF_TO_BGP permit 10
 match ip address prefix-list PL_LOOPBACK
!
end

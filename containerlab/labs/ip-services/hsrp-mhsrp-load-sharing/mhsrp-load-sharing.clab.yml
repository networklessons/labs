# Multigroup HSRP (MHSRP) load sharing.
# R1, R2, H1 and H2 connected to SW1 (192.168.12.0/24).
# R1 is active for group 1 (192.168.12.254), H1's gateway.
# R2 is active for group 2 (192.168.12.253), H2's gateway.
# R3 is upstream with loopback 3.3.3.3, OSPF to R1 and R2.

name: mhsrp-load-sharing
mgmt:
  network: mgmt-ipv4
  ipv4-subnet: 10.65.97.0/24
topology:
  nodes:
    R1:
      kind: cisco_c8000v
      image: docker-registry.nwl.lab/cisco_c8000v:17.13.01a
      mgmt-ipv4: 10.65.97.11
      startup-config: ./clab-mhsrp-load-sharing/R1/config/startup-config.cfg
    R2:
      kind: cisco_c8000v
      image: docker-registry.nwl.lab/cisco_c8000v:17.13.01a
      mgmt-ipv4: 10.65.97.12
      startup-config: ./clab-mhsrp-load-sharing/R2/config/startup-config.cfg
    R3:
      kind: cisco_c8000v
      image: docker-registry.nwl.lab/cisco_c8000v:17.13.01a
      mgmt-ipv4: 10.65.97.13
      startup-config: ./clab-mhsrp-load-sharing/R3/config/startup-config.cfg
    H1:
      kind: linux
      image: networklessons/lab-node-ubuntu:270
      mgmt-ipv4: 10.65.97.64
      exec:
        - ip addr add 192.168.12.10/24 dev eth1
        - ip route replace default via 192.168.12.254 dev eth1
    H2:
      kind: linux
      image: networklessons/lab-node-ubuntu:270
      mgmt-ipv4: 10.65.97.65
      exec:
        - ip addr add 192.168.12.20/24 dev eth1
        - ip route replace default via 192.168.12.253 dev eth1
    SW1:
      kind: cisco_iol
      image: docker-registry.nwl.lab/cisco_iol:l2-17.12.01
      type: l2
      mgmt-ipv4: 10.65.97.101
  links:
    - endpoints: ["H1:eth1", "SW1:Ethernet0/1"]
    - endpoints: ["H2:eth1", "SW1:Ethernet0/2"]
    - endpoints: ["R1:eth1", "SW1:Ethernet0/3"]
    - endpoints: ["R2:eth1", "SW1:Ethernet1/0"]
    - endpoints: ["R1:eth2", "R3:eth1"]
    - endpoints: ["R2:eth2", "R3:eth2"]
